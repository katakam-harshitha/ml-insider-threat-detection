<!DOCTYPE html>
<html>

<head>
    <title>Prediction Result</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('{{ url_for('static', filename='inp3.jpeg') }}');
            background-size: cover;
            font-family: Arial, sans-serif;
            color: #fff;
            text-align: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 80px 30px;
            margin: 150px auto;
            width: 50%;
            border-radius: 15px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #FF5722, #FF8A65);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
            background: linear-gradient(135deg, #E64A19, #FF7043);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔍 Prediction Result</h1>
        <p>{{ prediction }}</p>
        <button onclick="location.href='/predict'">🔙 Return</button>
    </div>
</body>

</html>
